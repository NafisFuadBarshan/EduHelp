{% extends "base.html" %}
{% block title %}{{ heading }} · EduHelp{% endblock %}
{% block content %}
<section class="page page--narrow">
  <h1>{{ heading }}</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="btn">Save course</button>
    <a class="alt-link" href="{% url 'courses:teacher_dashboard' %}">Cancel</a>
  </form>
</section>
{% endblock %}
