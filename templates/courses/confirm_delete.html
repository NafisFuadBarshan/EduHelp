{% extends "base.html" %}
{% block title %}Confirm delete · EduHelp{% endblock %}
{% block content %}
<section class="page page--narrow">
  <h1>Delete {{ what }}?</h1>
  {% if note %}<p>{{ note }}</p>{% endif %}
  <form method="post" class="form">
    {% csrf_token %}
    <button type="submit" class="btn btn--danger">Yes, delete</button>
    <a class="alt-link" href="{{ cancel }}">Cancel</a>
  </form>
</section>
{% endblock %}
